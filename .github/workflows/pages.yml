name: Validar y desplegar Dashboard de Continuidad

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Validar aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mostrar versiones del entorno
        run: |
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas automáticas
        run: npm run test -- --passWithNoTests

      - name: Compilar aplicación
        run: npm run build

      - name: Verificar resultado de compilación
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: No existe la carpeta dist."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: No existe dist/index.html."
            exit 1
          fi

          echo "Compilación validada correctamente."

  build:
    name: Preparar GitHub Pages
    needs:
      - validate

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar versión de producción
        run: npm run build

      - name: Verificar archivos de producción
        run: |
          echo "Contenido de dist:"
          ls -la dist

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html no fue generado."
            exit 1
          fi

          echo "Artefacto preparado correctamente."

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar aplicación

    needs:
      - build

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
